# Staging overlay: the PRODUCTION image and settings (OPcache, preload, read-only containers, no debug),
# plus Mailpit so sign-in emails can be read while testing behind a tunnel before real SMTP is set up.
# Usage: COMPOSE_FILE=compose.yaml:compose.staging.yaml in .env, then docker compose up -d --build --wait
# Mailpit UI: http://127.0.0.1:${MAILPIT_UI_PORT:-8025} (never expose it publicly).
services:
  app:
    environment:
      MAILER_DSN: smtp://mailpit:1025

  maintenance:
    environment:
      MAILER_DSN: smtp://mailpit:1025

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Sign-in links land here. Loopback-only by default; if you set MAILPIT_BIND=0.0.0.0 to test from
      # phones on your LAN, also set MAILPIT_UI_AUTH="user:password" so nobody else can read them.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    networks: [backend, egress]
