# Development overlay: bind-mounted source, dev PHP image with pcov, Mailpit for email.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# Mailpit UI: http://127.0.0.1:8025 (never expose it publicly).
services:
  app:
    build: { context: ., target: dev }
    image: neighborhood-events-map-app:dev
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - .:/app
      - appvar:/app/var          # per-stack cache/logs (two dev stacks can share one checkout)
      - branding:/app/var/branding
    networks: [backend, egress]
    # The dev image runs the PHP-FPM master as root (bind-mounted source), so it needs the default
    # capabilities and a writable root filesystem. Production keeps the hardening from compose.yaml.
    read_only: false
    cap_drop: !reset []

  nginx:
    volumes:
      - ./public:/app/public:ro

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    restart: unless-stopped
    ports:
      - "${MAILPIT_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Sign-in links land here. Loopback-only by default; if you set MAILPIT_BIND=0.0.0.0 to test from
      # phones on your LAN, also set MAILPIT_UI_AUTH="user:password" so nobody else can read them.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    networks: [backend, egress]   # internal-only networks cannot publish the (localhost-only) UI port

  backup:
    profiles: [backup]

  maintenance:
    profiles: [maintenance]   # dev stacks purge on demand: docker compose exec app php bin/console app:maintenance:purge

volumes:
  appvar: {}
