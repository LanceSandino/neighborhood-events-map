; Production-safe PHP defaults for the app container.
expose_php = Off
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 4M
max_execution_time = 30
; Outbound sockets (SMTP relay, optional routing provider) give up quickly instead of holding a worker.
default_socket_timeout = 10
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
; Session ids use PHP's fixed format since 8.4 (32 characters, 128 random bits; the length settings are deprecated).
; The app never reports upload progress. Off, it also closes the known paths to CVE-2026-109619 (PHP's own
; advice; updating PHP is the fix) and to CVE-2026-115560 (no fixed release yet).
session.upload_progress.enabled = 0
; CVE-2026-115560 also needs the serialize handler switched at runtime; the app keeps PHP's default and never
; changes a session setting with ini_set() (ContainerConfigTest checks the code).
session.serialize_handler = php
; PHP 8.5: fatal errors carry no backtrace (PHP's other partial mitigation for CVE-2026-109619); the log still
; has the message, file and line.
fatal_error_backtraces = Off
; No per-directory .user.ini files: every setting comes from the image (PHP's advisory warns against relying on them).
user_ini.filename =
; Organizer uploads carry one file per request (logo, GeoJSON or CSV); only the upload pool accepts files at all
; (docker/php/fpm-pool.conf).
max_file_uploads = 1
