; Production-safe PHP defaults for the app container.
expose_php = Off
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 4M
max_execution_time = 30
; Outbound sockets (SMTP relay, optional routing provider) give up quickly instead of holding a worker.
default_socket_timeout = 10
date.timezone = UTC
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
; Session ids use PHP's fixed format since 8.4 (32 characters, 128 random bits; the length settings are deprecated).
; The app never reports upload progress. Off, it also closes the known paths to CVE-2026-109619 (PHP's own
; advice; updating PHP is the fix).
session.upload_progress.enabled = 0
