; Production image only, loaded last and copied after the build steps (composer and cache:warmup need to run
; programs). Set at PHP startup, before OPcache preloading, so the preloaded code and the function table agree;
; never set disable_functions per FPM pool (see docker/php/fpm-pool.conf). Applies to PHP-FPM and to the
; console in the production image alike: no command of this app runs programs (Symfony's console checks
; function_exists() before using proc_open).
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
