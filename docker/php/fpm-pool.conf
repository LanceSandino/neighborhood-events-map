; PHP-FPM pools. FPM listens ONLY on Unix sockets in /run/php, a volume shared with the nginx container
; and nothing else: no TCP port, so no other process on the host or the Docker networks can speak FastCGI
; to it (FastCGI can set PHP settings per request, and the workers see the app's secrets in their env).
; Sockets are owned by www-data, group fcgi-nginx (gid 101, the nginx-unprivileged user), mode 0660.

[www]
listen = /run/php/app.sock
listen.owner = www-data
listen.group = fcgi-nginx
listen.mode = 0660
; Worker pool, tunable per host from .env (see docs/runbooks/deployment.md): each PHP worker uses about
; 30–40 MB, so FPM_MAX_CHILDREN ≈ memory you give PHP ÷ 40 MB. Defaults suit a small server.
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE}
pm.max_spare_servers = ${FPM_MAX_SPARE}
pm.max_requests = 500
; Kill a stuck request (e.g. a stalled SMTP relay) before it pins a worker; above nginx's 30 s read timeout.
request_terminate_timeout = 35s
ping.path = /fpm-ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Only the upload pool accepts files: PHP's multipart upload code never runs here.
php_admin_flag[file_uploads] = off
; Web workers never run programs or open URLs as files (the routing provider uses curl); console commands
; in the maintenance container keep the CLI defaults.
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; The email-sending endpoints (POST /api/auth/request-link and /api/disputes) wait out the response-time
; floor (AUTH_RESPONSE_FLOOR_MS) inside a worker. They run in this separate small pool, so a flood of
; sign-in or review requests can fill it but never the pool that serves the map and everything else.
[mail]
user = www-data
group = www-data
listen = /run/php/mail.sock
listen.owner = www-data
listen.group = fcgi-nginx
listen.mode = 0660
pm = ondemand
pm.max_children = ${FPM_MAIL_MAX_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 35s
ping.path = /fpm-ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Only the upload pool accepts files: PHP's multipart upload code never runs here.
php_admin_flag[file_uploads] = off
; Web workers never run programs or open URLs as files (the routing provider uses curl); console commands
; in the maintenance container keep the CLI defaults.
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Organizer uploads (POST /api/admin/community/logo, /geometries/import and /addresses/import) are the only
; requests that carry files. nginx sends only those three endpoints here and refuses a multipart body on every
; other path (415), so PHP parses multipart/form-data for nobody else. A small on-demand pool: organizers
; upload one file at a time.
[upload]
user = www-data
group = www-data
listen = /run/php/upload.sock
listen.owner = www-data
listen.group = fcgi-nginx
listen.mode = 0660
pm = ondemand
pm.max_children = ${FPM_UPLOAD_MAX_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = 100
request_terminate_timeout = 35s
ping.path = /fpm-ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
; Web workers never run programs or open URLs as files (the routing provider uses curl); console commands
; in the maintenance container keep the CLI defaults.
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
