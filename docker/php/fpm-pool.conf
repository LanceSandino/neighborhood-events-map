[www]
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Kill a stuck request (e.g. a stalled SMTP relay) before it pins a worker; above nginx's 30 s read timeout.
request_terminate_timeout = 35s
ping.path = /fpm-ping
ping.response = pong
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
