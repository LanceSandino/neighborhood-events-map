; Production-only PHP settings (image is immutable: code never changes inside a running container).
; OPcache: compiled code stays in memory and is never re-checked (validate_timestamps=0 in php.ini);
; a deploy replaces the container, which starts with an empty cache, so stale code is impossible.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; Preload Symfony's hot classes once when PHP-FPM starts (generated by cache:warmup at image build).
opcache.preload = /app/config/preload.php
opcache.preload_user = www-data
opcache.jit = off
