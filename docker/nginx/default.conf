# Reverse proxy + static assets for the Symfony app. Listens on 8080 (unprivileged).
# Publish only on 127.0.0.1 and put an HTTPS reverse proxy or tunnel in front.
server_tokens off;

# Access log WITHOUT query strings or Referer, so one-time sign-in tokens (/auth/confirm?t=...) never hit logs.
map $request_uri $path_only { ~^(?<p>[^?]*) $p; default $request_uri; }
log_format privacy '$remote_addr [$time_local] "$request_method $path_only $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# Client IP and scheme headers are trusted only from loopback and this container's gateway (the host's
# reverse proxy or tunnel behind the published 127.0.0.1 port), plus NGINX_TRUSTED_PROXIES.
# The list is generated at start by docker/nginx/trusted-proxy.sh; every other peer is taken as is.
include /tmp/nginx-trusted-proxy.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
map "$from_trusted_proxy:$http_x_forwarded_proto" $fwd_proto { "1:https" https; "1:http" http; default $scheme; }
map $fwd_proto $fcgi_https { https on; default ""; }

# The client's network, as the app keys it (App\Security\ClientIdentity): an IPv4 address, or the /64 of
# an IPv6 address. One subscriber or server gets a whole /64, so keying on the full IPv6 address would give
# a single client 2^64 separate budgets. nginx prints IPv6 compressed (its longest run of two or more zero
# groups as "::"), so each line below handles one shape and writes out the first four groups, zeros included.
map $remote_addr $client_net {
    "~^(::ffff:)?(?<v4>[0-9.]+)$"                          $v4;            # IPv4, IPv4-mapped IPv6
    "~^(?<n>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"     $n;
    "~^(?<n>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"              $n:0;
    "~^(?<n>[0-9a-f]+:[0-9a-f]+)::"                        $n:0:0;
    "~^(?<n>[0-9a-f]+)::(?<m>[0-9a-f]+)(:[0-9a-f]+){4}$"   $n:0:0:$m;
    "~^(?<n>[0-9a-f]+)::"                                  $n:0:0:0;
    "~^::(?<m>[0-9a-f]+:[0-9a-f]+)(:[0-9a-f]+){4}$"        0:0:$m;
    "~^::(?<m>[0-9a-f]+)(:[0-9a-f]+){4}$"                  0:0:0:$m;
    "~^::"                                                 0:0:0:0;
    default                                                $remote_addr;
}

# First line of defence against floods, before PHP runs (the app adds proof-of-work and persistent,
# per-purpose limits). Keys are empty for pages and static files, so only API calls are counted.
# Matched on $uri (decoded and normalized, like the location match and the app's router), never on the
# raw $request_uri: otherwise /%61pi/... would route to the API with an empty key and skip both limits.
map $uri $api_client  { ~^/api/ $client_net; default ""; }
map $uri $auth_client { ~^/(api/(auth/|pow|disputes|addresses/|me/homes)|auth/) $client_net; default ""; }
limit_req_zone $api_client  zone=api:10m  rate=10r/s;
limit_req_zone $auth_client zone=auth:10m rate=60r/m;
limit_conn_zone $client_net zone=perip:10m;

# Compress text responses (HTML, JSON, CSS, JS, SVG, GeoJSON): roughly 70 % smaller on the wire.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml text/plain application/xml;

server {
    listen 8080;
    server_name _;
    root /app/public;
    client_max_body_size 1m;          # organizer uploads get 6m below
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_req zone=api burst=40 nodelay;
    limit_req zone=auth burst=30 nodelay;
    limit_req_status 429;
    limit_conn perip 40;              # static files; requests that reach PHP have lower caps below
    limit_conn_status 429;
    # Rejections are visible as 429 in the (query-free) access log. At the default "error" level nginx
    # would also write the full request line, including one-time /auth/confirm?t=… tokens, to the error log.
    limit_req_log_level info;
    limit_conn_log_level info;
    access_log /dev/stdout privacy;   # server-level: replaces the image's default (combined) access log

    add_header X-Content-Type-Options nosniff always;

    # No page, asset or API path of this app is percent-encoded. Encoded paths are refused outright so
    # nothing (nginx limits, app guards) can disagree with the router about what a path means.
    if ($request_uri ~ "^[^?]*%") {
        return 400;
    }

    location = /healthz {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    # Pages load assets from /assets/v<version>.<fingerprint>/… (Twig asset_path); the fingerprint changes
    # with any asset change, so every module URL changes (relative imports follow), no browser or CDN edge
    # can mix an old module with new ones, and the versioned copies can be cached for a year.
    # A named capture: the limit maps' regexes run after the location is chosen and would overwrite $1.
    location ~ "^/assets/v[A-Za-z0-9._+-]+/(?<asset>.+)$" {
        alias /app/public/assets/$asset;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ES modules import each other by plain relative URLs, so scripts must revalidate on every load
    # (cheap 304s) or an upgrade would mix old and new modules in a returning visitor's browser.
    location ^~ /assets/js/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location ~* ^/(assets|vendor|fonts)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Pages and the API end in PHP. One client network may keep at most 6 requests in PHP at a time, half of
    # the default www pool (FPM_MAX_CHILDREN=12), so no single client can occupy every worker. nginx applies
    # the limits of the first location a request matches, so they are set here, not in the internal one.
    location / {
        limit_conn perip 6;
        try_files $uri /index.php$is_args$args;
    }

    # Organizer uploads (logo, GeoJSON, CSV) are the only bodies larger than 1 MB.
    location ^~ /api/admin/ {
        limit_conn perip 6;
        client_max_body_size 6m;
        fastcgi_pass unix:/run/php/app.sock;
        include /etc/nginx/snippets/app-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Email-sending endpoints run in PHP-FPM's separate small "mail" pool (docker/php/fpm-pool.conf), so
    # the response-time floor they wait out can never take every worker away from the map.
    location = /api/auth/request-link {
        limit_conn perip 2;           # half of the mail pool (FPM_MAIL_MAX_CHILDREN=4)
        fastcgi_pass unix:/run/php/mail.sock;
        include /etc/nginx/snippets/app-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location = /api/disputes {
        limit_conn perip 2;           # half of the mail pool (FPM_MAIL_MAX_CHILDREN=4)
        fastcgi_pass unix:/run/php/mail.sock;
        include /etc/nginx/snippets/app-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/app.sock;
        include /etc/nginx/snippets/app-fastcgi.conf;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
