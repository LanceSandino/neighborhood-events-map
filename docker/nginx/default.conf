# Reverse proxy + static assets for the Symfony app. Listens on 8080 (unprivileged).
# Publish only on 127.0.0.1 and put Cloudflare Tunnel (or another HTTPS proxy) in front.
server_tokens off;

# Access log WITHOUT query strings or Referer, so one-time sign-in tokens (/auth/confirm?t=...) never hit logs.
map $request_uri $path_only { ~^(?<p>[^?]*) $p; default $request_uri; }
log_format privacy '$remote_addr [$time_local] "$request_method $path_only $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# Client IP and scheme headers are trusted only from loopback and this container's gateway (the host's
# reverse proxy / Cloudflare Tunnel behind the published 127.0.0.1 port), plus NGINX_TRUSTED_PROXIES.
# The list is generated at start by docker/nginx/trusted-proxy.sh; every other peer is taken as is.
include /tmp/nginx-trusted-proxy.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
map "$from_trusted_proxy:$http_x_forwarded_proto" $fwd_proto { "1:https" https; "1:http" http; default $scheme; }
map $fwd_proto $fcgi_https { https on; default ""; }

# First line of defence against floods, before PHP runs (the app adds proof-of-work and persistent,
# per-purpose limits). Keys are empty for pages and static files, so only API calls are counted.
map $request_uri $api_client  { ~^/api/ $binary_remote_addr; default ""; }
map $request_uri $auth_client { ~^/(api/(auth/|pow|disputes|addresses/|me/homes)|auth/) $binary_remote_addr; default ""; }
limit_req_zone $api_client  zone=api:10m  rate=10r/s;
limit_req_zone $auth_client zone=auth:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 8080;
    server_name _;
    root /app/public;
    client_max_body_size 1m;          # organizer uploads get 6m below
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_req zone=api burst=40 nodelay;
    limit_req zone=auth burst=30 nodelay;
    limit_req_status 429;
    limit_conn perip 40;
    limit_conn_status 429;
    access_log /dev/stdout privacy;   # server-level: replaces the image's default (combined) access log

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location ~* ^/(assets|vendor|fonts)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Organizer uploads (logo, GeoJSON, CSV) are the only bodies larger than 1 MB.
    location ^~ /api/admin/ {
        client_max_body_size 6m;
        include /etc/nginx/snippets/app-fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location ~ ^/index\.php(/|$) {
        include /etc/nginx/snippets/app-fastcgi.conf;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
