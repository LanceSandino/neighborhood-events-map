# Shared FastCGI settings for the Symfony front controller (included by default.conf). Each location sets
# fastcgi_pass itself: unix:/run/php/app.sock (everything) or unix:/run/php/mail.sock (email-sending endpoints).
include fastcgi_params;
fastcgi_param DOCUMENT_ROOT /app/public;
fastcgi_param REMOTE_ADDR $remote_addr;
# nginx resolves the client IP/scheme; PHP never trusts forwarded headers itself.
fastcgi_param HTTPS $fcgi_https;
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_FORWARDED_PROTO "";
fastcgi_param HTTP_X_FORWARDED_HOST "";
fastcgi_param HTTP_X_FORWARDED_PORT "";
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_PROXY "";
fastcgi_read_timeout 30s;
