# Weekly dependency update PRs (security fixes arrive as soon as advisories are published).
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # The app stays on the Symfony 7.4 LTS line (DECISIONS D-20261018-02); majors are a deliberate upgrade.
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      # nginx odd minor versions are the mainline branch; the image tracks the stable (even) branch.
      - dependency-name: "nginxinc/nginx-unprivileged"
        versions: [">= 1.31, < 1.32", ">= 1.33, < 1.34", ">= 1.35, < 1.36"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule: { interval: monthly }
    # When @playwright/test changes, bump the matching image tag in bin/e2e.sh in the same PR.
