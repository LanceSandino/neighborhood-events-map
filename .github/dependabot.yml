# Weekly dependency update PRs (security fixes arrive as soon as advisories are published).
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/tests/e2e"
    schedule: { interval: monthly }
    # When @playwright/test changes, bump the matching image tag in bin/e2e.sh in the same PR.
