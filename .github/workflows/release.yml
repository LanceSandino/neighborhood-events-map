# On an annotated vX.Y.Z tag: verify VERSION/CHANGELOG match, then open a DRAFT GitHub Release
# with that CHANGELOG section. Publishing the draft stays a manual owner decision.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION and CHANGELOG match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$(tr -d '[:space:]' < VERSION)" = "$tag" || { echo "VERSION != $tag"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG has no [$tag] section"; exit 1; }
          awk -v v="$tag" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - name: Create draft release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          args=(--draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
