# DBAL only (no ORM): explicit parameterized SQL for atomic claims and auditing. Nested transactions use
# savepoints (always on in DBAL 4; DoctrineBundle 3 dropped the use_savepoints option).
doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '18'
        profiling_collect_backtrace: '%kernel.debug%'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
