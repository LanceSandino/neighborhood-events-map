monolog:
    channels:
        - deprecation
        - security_audit

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "php://stderr"
                level: info
                channels: ["!event", "!doctrine"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [400, 401, 403, 404, 405, 409, 422, 429]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [400, 401, 403, 404, 405, 409, 422, 429]
                buffer_size: 50
                channels: ["!deprecation"]
            nested:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
