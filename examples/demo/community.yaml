# FICTIONAL DEMO community — for development, screenshots and the "generic second install" test.
# No zones, different branding/date. The outline sits inside an uninhabited forest so it can never
# be mistaken for real homes. Demo homes are created only with APP_DEMO=1 (bin/console app:demo:seed).
schema_version: 1
community:
  id: maple-hollow-demo
  name: "Maple Hollow"
  subtitle: "A fictional demo neighborhood"
  locality: "Demo Town"
  region: "FL"
  country: "US"
  timezone: "America/Chicago"
  gate_notice: "Fictional demo data — these homes do not exist."
  contact_url: "mailto:organizer@example.org"
  access: public
  about: |
    Maple Hollow is a FICTIONAL neighborhood used to demonstrate the app. Every home, street and note here is invented.

    Anyone can browse the map, filter for gentle or spooky stops and plan a route; residents list their own homes with a one-time email link.
  links:
    - { label: "Project on GitHub", url: "https://github.com/" }
event:
  type: halloween
  name: "Halloween"
  date: "2026-10-30"
  starts_at: "16:30"
  ends_at: "20:30"
branding:
  brand_emoji: "🦇"
  primary_color: "#2E7D6B"
  accent_color: "#6B4FA0"
  headline: "Spooky streets."
  headline_accent: "Sweet treats."
  intro: "Fictional demo: explore how trick-or-treaters find treats and plan stops."
map:
  boundary_file: boundary.geojson
  zoom: 16
  tiles:
    url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    attribution: "© OpenStreetMap contributors"
zones: []
features:
  optional_zones: false
registration:
  enabled: true
  address_mode: both
  street_allowlist: ["Pumpkin Patch Ln", "Lantern Way", "Cobweb Ct", "Moonbeam Dr"]
routing:
  groups: []
