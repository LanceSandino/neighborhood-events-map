# Reference configuration for a garage or rummage sale (event type garage_sale) — commented, safe to commit.
# Copy it to deploy/community/community.yaml, replace the placeholders and set
# COMMUNITY_BOOTSTRAP_FILE=/app/deploy/community/community.yaml in .env. The file is imported once, into an empty
# install; afterwards everything is edited in the organizer console, and later events are prepared under
# Organizer → Events (docs/runbooks/organizer-events.md). The Halloween reference is config/community.example.yaml,
# the Christmas lights' is holiday-lights.community.yaml next to this file. Keys left out take their defaults.
schema_version: 1
community:
  id: example-sale                  # lowercase letters, digits, dashes; never changes (saved routes are kept under it)
  name: "Your Neighborhood"
  subtitle: "Your neighborhood. Good finds."
  locality: "Your City"
  region: "Your State"
  country: "US"
  timezone: "America/New_York"      # IANA time zone: "Open now" and each sale day's hours are on this clock
  gate_notice: ""
  contact_url: null                 # REPLACE with a mailto link to the organizer or a contact page (About, Privacy, Terms)
  access: public                    # public | gated_open | gated_guests | private | unspecified
  about: ""
  links: []
  reminders: []                     # your own sale etiquette (up to 12 lines); empty = the built-in list
event:
  type: garage_sale
  name: "Community Rummage Sale"    # the public name (default "Garage Sale")
  starts_on: "2027-04-10"           # the first sale day
  ends_on: "2027-04-11"             # the last day of the span
  starts_at: "08:00"                # the hours most homes keep; each home sets its own hours on each of its days
  ends_at: "14:00"
  settings:                         # applied to the install's first event only
    days: ["2027-04-10", "2027-04-11"]   # 1–3 sale days inside the span; a span of up to 3 days may leave this out
    categories: [kids_baby, toys, furniture, clothing, tools, books_media, electronics, sports, household, free]
                                    # the categories residents may list (all ten when left out); the map offers
                                    # filters only for these
    early_bird_time: "07:30"        # optional: "Early birds: not before 7:30 AM" in the sale row and the rules
    rules:                          # up to 8 lines of up to 160 characters
      - "No early birds before 7:30 AM."
      - "Park on one side of the street; keep driveways clear."
      - "No recalled or prohibited items."
    route_modes: [walking]          # add driving for a driving tour; it needs a configured routing provider too
# branding: leave it out to get the sale defaults (teal and coral, "Good finds. Close to home.").
map:
  boundary_file: null
  zoom: 16
  tiles:
    url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
    attribution: "© OpenStreetMap contributors"
zones: []
features:
  optional_zones: false
  walking_routes: true
registration:
  enabled: true
  address_mode: registry            # registry | self_entry | both
  street_allowlist: []
  review_new_addresses: false
routing:
  groups: []
  crossings_verified: false
  provider_enabled: false
