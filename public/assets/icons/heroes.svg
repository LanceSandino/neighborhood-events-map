<?xml version="1.0" encoding="UTF-8"?>
<!--
  @module public/assets/icons/heroes.svg
  @description Hero illustrations, drawn for this project: flat 240x160 scenes beside each event type's headline.
      hero-halloween (pumpkins and a friendly ghost under a moon, on its own night tile), hero-lights (a draped
      string of C9 bulbs around a small tree) and hero-sale (an open moving box with a price tag, and a plant).
      Colours are custom properties with fallbacks (hero-*, bulb-*; written with the usual two leading hyphens);
      the lights and sale scenes have no background and take their wire, string and ground from the page's muted
      and border tokens, so they sit on light and dark surfaces. Glows are soft and still: nothing flashes or animates.
  @dependencies none (colours come from the page: hero-* and bulb-* custom properties, muted, border, surface)
-->
