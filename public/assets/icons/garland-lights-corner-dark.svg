<?xml version="1.0" encoding="UTF-8"?>
<!--
  @module public/assets/icons/garland-lights-corner-dark.svg
  @description A short, non-repeating swag for a corner or an edge: three C9 bulbs (red, yellow, blue) on a green wire
      between two tacks, with a loose end. Mirror it with transform: scaleX(-1) for the other corner.
      Fixed classic colours, drawn for this project; flat shapes with a soft radial halo. Static: nothing animates or
      flashes. The -dark file has a lighter wire and a wider, brighter halo for dark surfaces. Use from CSS as background-image (works under the strict CSP); decorative only.
  @dependencies none
-->
