  <path fill="none" stroke="var(--mark-detail, #178d80)" stroke-width="2" stroke-linecap="round" d="M14.2 14.2C11.6 10.4 8.4 6.6 5.6 5.2 3.6 4.2 2.4 5.6 3.2 7.2c1.1 2.2 5.1 3.6 10.6 7.8"/>
</symbol>
