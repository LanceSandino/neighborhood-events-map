  <rect fill="var(--mark-light, #fff3dc)" x="13.2" y="29.5" width="4.2" height="4.2" rx="1"/>
  <rect fill="var(--mark-light, #fff3dc)" x="30.6" y="29.5" width="4.2" height="4.2" rx="1"/>
  <circle fill="var(--mark-ink, #3d3155)" cx="26.2" cy="37.6" r=".9"/>
