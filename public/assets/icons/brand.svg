    <path fill="var(--mark-shine, #fff)" fill-opacity=".85" d="M-2.9 7.4C-3.6 8.3-3.85 9.6-3.6 10.9C-3.45 11.6-2.55 11.5-2.5 10.8C-2.45 9.7-2.25 8.8-1.85 8.1C-1.5 7.4-2.4 6.8-2.9 7.4Z"/>
    <path fill="var(--mark-detail, #2c7446)" d="M-2.35 .2H2.35C2.75 .2 3 .45 3 .85V4.3H-3V.85C-3 .45-2.75.2-2.35.2Z"/>
