<?xml version="1.0" encoding="UTF-8"?>
<!--
  @module public/assets/icons/brand.svg
  @description Brand marks, drawn for this project: 48x48 two-tone symbols for the sidebar brand, the event switcher
      and the admin header. brand-halloween (a pumpkin), brand-lights (a C9 Christmas bulb: tapered faceted glass,
      ribbed screw base), brand-sale (a price tag) and brand-community (a house, for pages with no event). Colours
      are custom properties with fallbacks: mark-main, mark-shade, mark-light, mark-detail, mark-detail-2,
      mark-metal, mark-metal-shade, mark-ink and mark-hole (written with the usual two leading hyphens), so a tile
      can recolour a mark (for example light tones on the brand colour). Flat shapes only; nothing animates.
  @dependencies none (colours come from the page: mark-* custom properties, surface)
-->
<svg xmlns="http://www.w3.org/2000/svg">
<symbol id="brand-halloween" viewBox="0 0 48 48">
  <path fill="var(--mark-detail, #4f7a3a)" d="M22.4 16c-.2-3.5.7-6.6 2.9-9.1l2.9 1.7c-1.6 2-2.3 4.4-2.1 7.4z"/>
  <path fill="var(--mark-detail-2, #76a346)" d="M26.5 12.6c1.6-3.3 5.5-4.9 9-3.8-1.2 3.5-5.1 5.4-9 3.8z"/>
  <path fill="none" stroke="var(--mark-detail, #4f7a3a)" stroke-width="1.6" stroke-linecap="round" d="M23.2 13.6c-2.6.2-4.8-1.4-4.8-3.4 0-1.4 1.6-2 2.4-.9"/>
  <ellipse fill="var(--mark-shade, #d35e27)" cx="14.5" cy="28.5" rx="10.5" ry="12.5"/>
  <ellipse fill="var(--mark-shade, #d35e27)" cx="33.5" cy="28.5" rx="10.5" ry="12.5"/>
  <ellipse fill="var(--mark-main, #f07936)" cx="18.5" cy="28.5" rx="8.5" ry="13.5"/>
  <ellipse fill="var(--mark-main, #f07936)" cx="29.5" cy="28.5" rx="8.5" ry="13.5"/>
  <ellipse fill="var(--mark-main, #f07936)" cx="24" cy="28.5" rx="8" ry="14"/>
  <path fill="none" stroke="var(--mark-shade, #d35e27)" stroke-width="1.5" stroke-linecap="round" d="M18.6 16.2c-2.2 3.3-3.3 7.6-3.3 12.3s1.1 9 3.3 12.3M29.4 16.2c2.2 3.3 3.3 7.6 3.3 12.3s-1.1 9-3.3 12.3"/>
  <path fill="none" stroke="var(--mark-light, #ffb27a)" stroke-width="2.2" stroke-linecap="round" d="M21.3 19.6c-1 2.2-1.5 4.6-1.5 7.2"/>
</symbol>
<symbol id="brand-lights" viewBox="0 0 48 48">
  <path fill="var(--mark-main, #e8b84a)" d="M24 4.5c2.8 4.5 10.5 13.3 10.5 20.4 0 2.2-1 3.6-2.9 4.4H16.4c-1.9-.8-2.9-2.2-2.9-4.4C13.5 17.8 21.2 9 24 4.5z"/>
  <path fill="var(--mark-shade, #c8912b)" d="M24 5.4c2.6 4.4 9.4 12.8 9.5 19.6.04 1.9-.75 3.2-2.3 4.3H24z"/>
  <path fill="none" stroke="var(--mark-light, #fff3cc)" stroke-width="2.4" stroke-linecap="round" d="M18.6 15.8c-1.4 2.6-2.2 5.3-2.1 8"/>
  <path fill="none" stroke="var(--mark-light, #fff3cc)" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".55" d="M24 8.5v17.5"/>
  <rect fill="var(--mark-metal-shade, #737c8c)" x="16.5" y="29" width="15" height="3" rx="1.2"/>
  <path fill="var(--mark-metal, #aab2bf)" d="M18 32h12v8.2c0 .9-.7 1.6-1.6 1.6h-8.8c-.9 0-1.6-.7-1.6-1.6z"/>
  <path fill="none" stroke="var(--mark-metal-shade, #737c8c)" stroke-width="1.6" stroke-linecap="round" d="M18 34.9l12-1.6M18 38.4l12-1.6"/>
  <path fill="var(--mark-ink, #3d4250)" d="M20.6 41.8h6.8l-1.3 2.4a1.4 1.4 0 0 1-1.2.8h-1.8a1.4 1.4 0 0 1-1.2-.8z"/>
</symbol>
<symbol id="brand-sale" viewBox="0 0 48 48">
