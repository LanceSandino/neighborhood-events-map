  <path fill="var(--mark-shade, #6c58a6)" d="M5.3 22.6 22.2 7.6c1-.9 2.6-.9 3.6 0l16.9 15c1.2 1.1.5 3.1-1.1 3.1H6.4c-1.6 0-2.3-2-1.1-3.1z"/>
  <path fill="var(--mark-light, #fff3dc)" d="M24 22.8c-1.3-1.8-4.4-1.4-4.4 1 0 2.2 2.8 3.8 4.4 4.9 1.6-1.1 4.4-2.7 4.4-4.9 0-2.4-3.1-2.8-4.4-1z"/>
