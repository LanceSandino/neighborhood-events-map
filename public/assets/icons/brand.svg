  <path fill="none" stroke="var(--mark-light, #fff1ea)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2.6" stroke-opacity=".75" d="M10.5 21.6V12c0-.85.65-1.5 1.5-1.5h9.6c.4 0 .8.15 1.05.45l14.2 14.2c.6.6.6 1.5 0 2.1L26.3 37.8c-.6.6-1.5.6-2.1 0L10.95 22.65c-.3-.25-.45-.65-.45-1.05z"/>
