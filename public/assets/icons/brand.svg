  <circle fill="var(--mark-hole, var(--surface, #fff))" stroke="var(--mark-shade, #c55c3d)" stroke-width="1.4" cx="15.5" cy="15.5" r="3"/>
  <path fill="none" stroke="var(--mark-light, #fff1ea)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 26 26)" d="M29.6 21.6c-.7-1.4-2-2.1-3.6-2.1-2.1 0-3.6 1.2-3.6 2.9 0 4 7.4 2.1 7.4 6.1 0 1.7-1.6 3-3.8 3-1.7 0-3.1-.8-3.7-2.1M26 17v2.5M26 31.5V34"/>
  <path fill="none" stroke="var(--mark-detail, #178d80)" stroke-width="2" stroke-linecap="round" d="M14.2 14.2C11.6 10.4 8.4 6.6 5.6 5.2 3.6 4.2 2.4 5.6 3.2 7.2c1.1 2.2 5.1 3.6 10.6 7.8"/>
</symbol>
<symbol id="brand-community" viewBox="0 0 48 48">
  <rect fill="var(--mark-shade, #6c58a6)" x="31.5" y="9" width="5" height="10" rx="1"/>
  <path fill="var(--mark-main, #f3d6b3)" d="M10.5 22h27v17.5c0 1.4-1.1 2.5-2.5 2.5H13c-1.4 0-2.5-1.1-2.5-2.5z"/>
