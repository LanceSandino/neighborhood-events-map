  <path fill="var(--mark-light, #fff3dc)" d="M24 22.8c-1.3-1.8-4.4-1.4-4.4 1 0 2.2 2.8 3.8 4.4 4.9 1.6-1.1 4.4-2.7 4.4-4.9 0-2.4-3.1-2.8-4.4-1z"/>
  <path fill="var(--mark-detail, #f07936)" d="M19.5 42V33.5a4.5 4.5 0 0 1 9 0V42z"/>
  <rect fill="var(--mark-light, #fff3dc)" x="13.2" y="29.5" width="4.2" height="4.2" rx="1"/>
  <rect fill="var(--mark-light, #fff3dc)" x="30.6" y="29.5" width="4.2" height="4.2" rx="1"/>
  <circle fill="var(--mark-ink, #3d3155)" cx="26.2" cy="37.6" r=".9"/>
</symbol>
</svg>
