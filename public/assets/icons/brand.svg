  <g transform="translate(24 6.4) scale(2.0)">
    <path fill="none" stroke="var(--mark-ink, #245c38)" stroke-width="1" stroke-linecap="round" d="M2.4 1.1C3.9 1.1 4.3.2 4.3-.9C4.3-1.9 3.6-2.5 2.7-2.4"/>
    <path fill="var(--mark-main, #d6262b)" stroke="var(--mark-shade, #99161b)" stroke-width=".5" d="M-2.55 5.2C-4.35 5.75-4.95 7.9-4.95 9.9C-4.95 12.7-2.9 15.7-1.45 17.9C-.75 19.1.75 19.1 1.45 17.9C2.9 15.7 4.95 12.7 4.95 9.9C4.95 7.9 4.35 5.75 2.55 5.2Z"/>
